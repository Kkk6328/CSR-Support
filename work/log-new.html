    // NAS 目前以 HTTP 開啟；非安全來源沒有 crypto.randomUUID，先提供 Puter SDK 相容實作。
    (() => {
      if (typeof window.crypto?.randomUUID === 'function') return;
      const randomUUID = () => {
        const bytes = new Uint8Array(16);
        if (window.crypto?.getRandomValues) window.crypto.getRandomValues(bytes);
        else for (let index = 0; index < bytes.length; index += 1) bytes[index] = Math.floor(Math.random() * 256);
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;
        const hex = [...bytes].map((value) => value.toString(16).padStart(2, '0')).join('');
        return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
      };
      try {
        Object.defineProperty(window.crypto, 'randomUUID', { value: randomUUID, configurable: true });
      } catch (error) {
        window.crypto.randomUUID = randomUUID;
      }
    })();

        const sourceDepartment = document.querySelector('#ragicForm [name="processing_department"]')?.value || logRecord.processing_department || '';
        
        // 構建提報表單的字段（對應 report.html 中的字段）

          { key: 'field_1783792645702_pi66u', label: '客戶（由日誌帶入，不可變更）', type: 'text', value: logRecord.customer || '', locked: true },
          { key: 'status', label: '狀態（由日誌帶入）', type: 'select', value: logRecord.status || '', options: ['待辦中', '處理中', '觀察中', '已完成', '追"客"', '無須追蹤'], locked: true },

        ];
        
        let formHtml = '';
        
        reportFields.forEach(field => {
          let controlHtml = '';
          
          if (field.type === 'date') {
            controlHtml = `<input type="date" value="${this.escapeHtml(field.value)}" data-field-key="${field.key}">`;
          } else if (field.type === 'select') {
            controlHtml = `<select data-field-key="${field.key}" ${field.locked ? 'disabled' : ''}>
              <option value="">請選擇</option>
              ${field.options.map(opt => `<option value="${opt}" ${field.value === opt ? 'selected' : ''}>${opt}</option>`).join('')}
            </select>`;
          } else if (field.type === 'textarea') {
            controlHtml = `<textarea rows="4" data-field-key="${field.key}">${this.escapeHtml(field.value)}</textarea>`;
          } else {
            controlHtml = `<input type="text" value="${this.escapeHtml(field.value)}" data-field-key="${field.key}" ${field.locked ? 'readonly' : ''}>`;
          }
          
          formHtml += `
            <div class="linked-report-form-field">
              <label>${field.label}</label>
              ${controlHtml}
            </div>
          `;
        });
        
        grid.innerHTML = formHtml;

        grid.querySelectorAll('[data-field-key]').forEach(field => {

        // 客戶只能使用來源日誌的值，不能接受浮窗或 DOM 中被修改的內容。

        // 取得 Firebase collection

        if (!reportCollection) {
          alert('Firebase 未初始化，請稍後再試');
          return;
        }
        
        // 新增提報記錄

        const sourceLogUrl = sourceLogId ? `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(sourceLogId)}` : window.location.href;
        reportCollection.add({
          ...formData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          sourceLogId,
          sourceLogUrl,
          field_1783793471256_rn925: sourceLogUrl
        }).then(async (reportRef) => {
          const reportUrl = new URL(`report.html?id=${encodeURIComponent(reportRef.id)}`, window.location.href).href;
          if (sourceLogId) {
            try {
              await window.omniplayDb.collection('log_new').doc(sourceLogId).update({
                linked_report: true,
                report_enabled: true,
                reportEnabled: true,
                report_link: reportUrl,
                reportLink: reportUrl
              });
            } catch (error) {
              console.warn('提報已建立，但回寫日誌提報狀態與連結失敗：', error);
            }
          }
          window.showRagicNotice?.('提報已成功提交！');
          this.closeModal();
        }).catch(error => {
          console.error('提報失敗：', error);
          window.showRagicNotice?.('提報失敗，請稍後再試', { tone: 'error', duration: 4500 });
        });
      },
      
      escapeHtml: function(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;

              alert('請先選擇日誌表單的「處理部門」，再建立連動提報。');
              this.checked = false;
              departmentControl?.focus();

            const customerControl = document.querySelector('#ragicForm [name="customer"]');
            if (!String(customerControl?.value || '').trim()) {
              alert('請先填寫日誌表單的「客戶」，再建立連動提報。');
              this.checked = false;
              customerControl?.focus();
              return;
            }
            if (!window.getCurrentRagicRecordId?.()) {
              window.pendingLinkedReportAfterSave = true;
              this.checked = false;
              document.querySelector('#ragicForm')?.requestSubmit();
              return;
            }
            // 取得當前表單的記錄數據
            const formFields = document.querySelectorAll('#ragicForm [name]');

      if (objectText) {
        try {
          const parsed = JSON.parse(objectText);
          if (parsed && typeof parsed === 'object') {
            result.analysis ||= String(parsed.analysis ?? parsed.ANALYSIS ?? parsed['AI分析'] ?? '').trim();
            result.summary ||= String(parsed.summary ?? parsed.SUMMARY ?? parsed['總結'] ?? '').trim();
            result.customerBrief ||= String(parsed.customerBrief ?? parsed.CUSTOMER_BRIEF ?? parsed['客戶問題短述'] ?? '').trim();
            result.supportBrief ||= String(parsed.supportBrief ?? parsed.SUPPORT_BRIEF ?? parsed['我方處理短述'] ?? '').trim();
          }
        } catch (_) {
          // 容許 JSON 字串中含未跳脫換行。
        }

        keys.forEach(([key], index) => {
          if (result[key]) return;
          const remainingKeys = keys.slice(index + 1).map(([nextKey]) => nextKey).join('|');
          const ending = remainingKeys
            ? `(?=\\s*,?\\s*"(?:${remainingKeys})"\\s*:|\\s*})`
            : '(?=\\s*})';
          const match = objectText.match(new RegExp(`"${key}"\\s*:\\s*"([\\s\\S]*?)"\\s*${ending}`));
          if (!match) return;
          result[key] = match[1]
            .replace(/\\n/g, '\n')
            .replace(/\\r/g, '')
            .replace(/\\"/g, '"')
            .replace(/\\\\/g, '\\')
            .trim();
        });
      }

      const extractSection = (title) => {
        const match = raw.match(new RegExp(`(?:【|#{1,4}\\s*)${title}(?:】)?\\s*[:：]?\\s*([\\s\\S]*?)(?=\\n\\s*(?:【|#{1,4}\\s*)|$)`, 'i'));
        return match?.[1]?.trim() || '';
      };
      const customerIssue = extractSection('客戶問題');
      const customerImage = extractSection('客戶圖片');
      const internalHandling = extractSection('內部處理');
      const ownImage = extractSection('我方圖片');
      const progress = extractSection('目前進度');
      const todos = extractSection('後續待辦');

      result.analysis ||= /【(?:客戶問題|內部處理|問題判斷|目前進度|後續待辦)】/.test(raw) ? raw : '';
      result.customerBrief ||= [customerIssue, customerImage].filter(Boolean).join('；');
      result.supportBrief ||= [internalHandling, ownImage, progress, todos].filter(Boolean).join('；');
      result.summary ||= [customerIssue, progress, todos].filter(Boolean).join('；');

      if (!result.analysis) result.analysis = raw;
      result.summary ||= '請依完整 AI 分析確認案件進度。';
      result.customerBrief ||= customerIssue || '請參考完整 AI 分析。';
      result.supportBrief ||= internalHandling || progress || '請參考完整 AI 分析。';
      return result;
    };

    const logNewAiResponseText = (response) => {
      if (typeof response === 'string') return response;
      const content =
        response?.message?.content ??
        response?.choices?.[0]?.message?.content ??
        response?.content ??
        response?.result?.message?.content ??
        response?.result?.text ??
        response?.text ??
        '';
      if (typeof content === 'string') return content;
      if (Array.isArray(content)) {
        return content
          .map((item) => typeof item === 'string' ? item : (item?.text ?? item?.content ?? ''))
          .filter(Boolean)
          .join('\n');
      }
      if (content && typeof content === 'object') {
        try { return JSON.stringify(content); } catch (_) { return String(content); }
      }
      return '';
    };

    const logNewAiFastHash = (value = '') => {
      const text = String(value);
      let hash = 2166136261;
      const step = Math.max(1, Math.floor(text.length / 4000));
      for (let index = 0; index < text.length; index += step) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      hash ^= text.length;
      return (hash >>> 0).toString(36);
    };
    const logNewAiCacheKey = (type, fingerprint) => `omniplay-log-new-ai-v2:${type}:${fingerprint}`;
    const readLogNewAiCache = (type, fingerprint) => {
      try { return JSON.parse(localStorage.getItem(logNewAiCacheKey(type, fingerprint)) || 'null'); }
      catch (_) { return null; }
    };
    const writeLogNewAiCache = (type, fingerprint, value) => {
      try { localStorage.setItem(logNewAiCacheKey(type, fingerprint), JSON.stringify(value)); }
      catch (error) { console.warn('AI 快取儲存失敗：', error); }
    };
    const logNewRowFingerprint = (row) => {
      const conversation = row.querySelector('[data-subfield="conversation"]')?.value.trim() || '';
      const imageSource = row.querySelector('[data-subfield="image_source"]')?.value || '自動判斷';
      const images = getLogNewRowImages(row);
      return logNewAiFastHash(JSON.stringify({ conversation, imageSource, images }));
    };
    const logNewImageMedia = async (source, index) => {
      if (!String(source).startsWith('data:')) return source;
      const original = String(source);
      const image = await new Promise((resolve, reject) => {
        const element = new Image();
        element.onload = () => resolve(element);
        element.onerror = () => reject(new Error(`圖${index + 1} 無法讀取`));
        element.src = original;
      });
      const maxSide = 1600;
      const scale = Math.min(1, maxSide / Math.max(image.naturalWidth || 1, image.naturalHeight || 1));
      const width = Math.max(1, Math.round(image.naturalWidth * scale));
      const height = Math.max(1, Math.round(image.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(image, 0, 0, width, height);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.86));
      if (!blob) throw new Error(`圖${index + 1} 壓縮失敗`);
      return new File([blob], `log-new-image-${index + 1}.jpg`, { type: 'image/jpeg' });
    };

    const inferLogNewImageOwner = (conversation, imageNumber, selectedSource) => {
      if (selectedSource === '客戶' || selectedSource === '我方團隊') return selectedSource;
      const marker = new RegExp(`[（(]\\s*圖\\s*${imageNumber}\\s*[）)]`, 'i').exec(conversation);
      if (!marker) return '來源待確認';
      const beforeMarker = conversation.slice(0, marker.index);
      const headerPattern = /\[[^\]\n]+\]\s*([^\n:：]{1,120})[:：]/g;
      let header;
      let speaker = '';
      while ((header = headerPattern.exec(beforeMarker))) speaker = header[1].trim();
      const normalizedSpeaker = speaker.toLowerCase().replace(/[_\s-]+/g, ' ');
      const internalNames = [
        'igaming op', '中魁', 'jerry hu', 'andy chou', 'jim li', 'lucas', 'anton', 'hazel',
        'pc am', 'cia', 'weiliya', 'apple', 'diane', 'kkaren', 'crystal', 'rondo', 'leo chang',
        'yeh ryan', 'chuan chia lai', '賢 rd', 'nick', 'nina', '張家豪', 'yuting wang', 'chang how',
        'weili huang', 'ellie', 'mike yu', '修全', 'tony yang', 'andrew', 'pien', 'suigetsu'
      ];
      return internalNames.some((name) => normalizedSpeaker.includes(name)) ? '我方團隊' : (speaker ? '客戶' : '來源待確認');
    };

    const mergeLogNewImageFindings = (analysis, findings = []) => {
      let output = normalizeLogNewAiAnalysis(analysis);
      const appendTo = (title, lines) => {
        if (!lines.length) return;
        output = output.replace(new RegExp(`(【${title}】\\n)([\\s\\S]*?)(?=\\n\\n【|$)`), (_, heading, current) => {
          const cleanCurrent = /^(?:對話或圖片未提供|圖片未提供|未提供)[。.]?$/.test(current.trim()) ? '' : current.trim();
          return `${heading}${[cleanCurrent, `圖片辨識：\n${lines.join('\n\n')}`].filter(Boolean).join('\n')}`;
        });
      };
      appendTo('客戶問題', findings.filter((item) => item.owner === '客戶').map((item) => item.text));
      appendTo('內部處理', findings.filter((item) => item.owner === '我方團隊').map((item) => item.text));
      appendTo('問題判斷', findings.filter((item) => item.owner === '來源待確認').map((item) => `${item.text}\n圖片來源待確認`));
      return output;
    };

    const ensureLogNewProcessingFileField = () => {

    const enhanceLogNewAiUi = () => {

      button.addEventListener('click', async () => {

        });

        const originalText = button.textContent;
        if (!puter.auth.isSignedIn()) {
          button.textContent = '等待 Puter 登入…';
          try {
            await puter.auth.signIn();

            if (errorCode === 'popup_blocked') {

        }

        button.disabled = true;
        forceButton.disabled = true;
        const totalUnits = Math.max(1, pendingJobs.reduce((total, job) => total + getLogNewRowImages(job.row).length + 1, 0));
        let completedUnits = 0;
        let progress = 0;
        let analysisSucceeded = false;
        const showProgress = (value) => {

          button.textContent = `AI 分析中 ${progress}%`;
        };
        showProgress(0);
        const progressTimer = setInterval(() => {
          if (progress >= 92) return;

        }, 700);
        try {
          const briefs = [];
          for (let index = 0; index < jobs.length; index += 1) {
            const job = jobs[index];
            const row = job.row;
            if (job.cached?.result) {
              // 保留使用者在畫面上手動修正過的分析文字；快取只用於避免重跑與彙整問題描述。
              briefs.push(job.cached.brief || {
                customerBrief: job.cached.result.customerBrief || '',
                supportBrief: job.cached.result.supportBrief || '',
                startsWithInternal: false,

              });

            }
            const conversationText = row.querySelector('[data-subfield="conversation"]')?.value.trim() || '（未提供文字對話）';
            const conversationEntries = logNewConversationEntries(conversationText);
            const visibleSpeakers = [...new Set(conversationEntries.map((entry) => entry.speaker).filter(Boolean))];
            const startsWithInternal = conversationEntries.length ? isLogNewInternalSpeaker(conversationEntries[0].speaker) : false;
            const firstInternalSpeaker = conversationEntries.find((entry) => isLogNewInternalSpeaker(entry.speaker))?.speaker || '';
            const internalDepartment = logNewSpeakerDepartment(firstInternalSpeaker) || '客服';

              .map((speaker) => {

              })
              .join('；');
            let conversation = `${conversationText}\n\n[系統圖片對照規則：圖片依上傳順序編號。對話中的（圖1）或(圖1)對應第一張圖片，（圖2）或(圖2)對應第二張，依此類推。必須以圖片標記所在的發言段落判斷提供者；有明確圖號時優先採用此對照，沒有圖號才依圖片來源選項與上下文判斷。]`;
            const images = getLogNewRowImages(row);
            const imageSource = row.querySelector('[data-subfield="image_source"]')?.value || '自動判斷';

                if (!imageText) {

                    await logNewImageMedia(images[imageIndex], imageIndex),

                  imageText = logNewAiResponseText(imageResponse);

                }
                imageFindings.push({

                });

                showProgress((completedUnits / totalUnits) * 92);
              }
              conversation += `\n\n[AI 圖像辨識結果]\n${imageFindings.map((item) => `${item.text}\n來源判斷：${item.owner}`).join('\n\n')}`;

            const prompt = `你是 OMNIPLAY 客服案件分析助手。必須依照下方唯一且完整的 OMNIPLAY 內部團隊名單辨識發言者。\n\nOMNIPLAY 內部團隊名單（只能用於判斷內外部，不能把未出現在對話中的名單人員寫入分析）：\n${logNewTeamDirectoryText}\n\n本段對話實際出現的發言者：${visibleSpeakers.join('、') || '無法辨識'}\n\n人員判斷規則（必須遵守）：\n1. 名單內的人才是 OMNIPLAY 內部人員；不在名單內的發言者一律視為客戶或外部窗口，不得寫成「可能是內部」、「未在名錄中需確認」或把外部人員列入【內部處理】。\n2. 比對姓名時忽略大小寫、emoji、空格、底線、連字號，以及商務、AM、PM、RD、IT、SRE、DBA、OP 等部門後綴。\n3. igaming-op 是 OMNIPLAY 客服帳號；其訊息結尾「-代碼」是客服人員代碼。分析內只能照原文寫 igaming-op 或該代碼，不得把代碼展開成對話中沒出現的姓名。\n4. 即使沒有 Excel、圖片或附件，也必須只依文字對話的發言者與內容完成內外部判斷。\n5. 團隊名單只供身分比對。分析中可出現的姓名僅限「本段對話實際出現的發言者」，不得加入名單中其他未發言的人。\n\n附圖資訊：共 ${images.length} 張；使用者標記的圖片來源為「${imageSource}」。只有實際有圖片時才能寫圖片內容；沒有圖片時，省略所有圖片段落，不得寫圖片推論。\n\n事實判斷規則（必須遵守）：\n1. 嚴格按照對話時間順序判斷「誰先提出／告知、誰轉請同仁查看、誰回覆」。不可預設一定是客戶先提出問題。\n2. 如果是 OMNIPLAY 先告知客戶異常或狀態，必須明確寫成「OMNIPLAY／igaming-op 主動告知客戶」，不可改寫成客戶反映。\n3. 只能寫對話或圖片明確出現的人、事件、數字、狀態、處理與回覆。玩家 ID、注單號、遊戲 ID、日期、時間與金額必須逐字複製，不得改寫、補零、換算或猜測。不可自行補充原因、缺少資料、風險、確認結果、處理方案或下一步。\n4. 對話沒有要求補注單號、玩家 ID、遊戲、金額或其他資料時，禁止建議補資料。\n5. 客戶僅將訊息轉請自己的同仁查看時，只能寫「客戶方轉請同仁查看」及實際回覆，不得描述成 OMNIPLAY 內部處理。\n\n輸出規則：\n1. analysis 只保留有明確對話事實的段落，可使用【事件經過】、【客戶方回覆】、【目前進度】；沒有內容的【客戶問題】、【客戶圖片】、【內部處理】、【我方圖片】、【問題判斷】、【後續待辦】必須省略，不得用推測補滿。\n2. summary 最多 80 個中文字，只摘要已發生的事與目前明確回覆；對話未交代下一步時，不得自行新增下一步。\n3. customerBrief 最多 35 個中文字；若客戶沒有提出問題，應寫客戶實際動作或回覆，不得虛構客戶問題。\n4. supportBrief 最多 45 個中文字，只寫 OMNIPLAY 在對話中實際做過的事。\n5. 所有內容使用繁體中文，語意完整，不得輸出省略號、截斷句、emoji、特殊圖形或「�」字元。\n\n對話內容：\n${conversation}`;
            const finalPrompt = `${prompt}

3. 先判斷對話共有幾個不同問題；同一問題的追問、補充與回覆不得重複計算。不同異常或不同需求才建立下一個編號。
4. customerBrief 與 supportBrief 必須使用「1. 簡述 2. 簡述」格式，雙方針對同一問題必須使用相同編號。每項最多 20 個中文字，只保留核心問題、動作或處理結果。
5. customerBrief 只寫客戶在各問題中的實際提出、回覆或處理狀態；客戶沒有對應內容時，該編號不要虛構內容。若客戶轉請自己的同仁確認，可簡寫為「已請人員確認」。
6. supportBrief 只寫 OMNIPLAY 內部人員在各問題中的實際提出、回覆或處理結果；不要在內容中重複客服、商務、技術等部門名稱。沒有對應內容時，該編號不要虛構內容。
7. 問題描述會由系統依角色合併成各一行，格式例如「客服：1. 確認4筆9015 2. 重新整理再登入」及「客戶：1. 已請人員確認 2. 玩家無法進入遊戲」。只能寫已知事實，不得加入分析或建議。
8. 第一個問題由 OMNIPLAY 內部先提出，就先顯示該發言者的實際部門；由客戶先提出，就先顯示「客戶」。OMNIPLAY 內部部門由系統判斷，不得全部固定為客服。

嚴格使用以下分隔標記；標記不得省略，不要加 Markdown 程式碼框：
<<<ANALYSIS>>>
一至兩句事實摘要
<<<SUMMARY>>>
一句目前進度
<<<CUSTOMER_BRIEF>>>
1. 客戶在問題1的簡述 2. 客戶在問題2的簡述
<<<SUPPORT_BRIEF>>>
1. OMNIPLAY在問題1的簡述 2. OMNIPLAY在問題2的簡述
<<<END>>>`;
            const options = {
              model: 'gpt-5.4-nano',
              temperature: 0,
              max_tokens: 600
            };
            const response = await puter.ai.chat(finalPrompt, options);
            const raw = logNewAiResponseText(response);
            const result = parseLogNewAiResponse(raw);
            result.analysis = mergeLogNewImageFindings(result.analysis, imageFindings);
            result.verificationWarnings = validateLogNewAiResult({
              raw,
              result,
              source: `${conversationText}\n${imageFindings.map((item) => item.text).join('\n')}`,
              hasImages: images.length > 0
            });
            result.analysis = appendLogNewAiWarnings(result.analysis, result.verificationWarnings);
            row.classList.toggle('has-ai-verification-warning', result.verificationWarnings.length > 0);
            window.applyLogNewAiResult(row, result);
            const brief = {
              customerBrief: result.customerBrief || '',
              supportBrief: result.supportBrief || '',
              startsWithInternal,
              internalDepartment
            };
            briefs.push(brief);
            writeLogNewAiCache('row', job.fingerprint, { result, brief });
            completedUnits += 1;
            showProgress((completedUnits / totalUnits) * 98);
          }
          const issue = document.querySelector('#ragicForm [name="issue"]');
          if (issue) {
            const parseNumberedBriefItems = (value = '') => {
              const text = String(value)
                .replace(/\uFFFD/g, '')
                .replace(/[◆◇�]+/g, '')
                .replace(/\r\n?/g, '\n')
                .trim();
              if (!text) return [];
              const matches = [...text.matchAll(/(?:^|\s)(\d{1,2})[.、．]\s*([\s\S]*?)(?=\s+\d{1,2}[.、．]\s*|$)/g)];
              if (!matches.length) return [text.replace(/^\d{1,2}[.、．]\s*/, '').trim()].filter(Boolean);
              const items = [];
              matches.forEach((match) => {
                const number = Math.max(1, Number(match[1]) || 1);
                const brief = match[2]
                  .replace(/\s+/g, ' ')
                  .replace(/[。；，、\s]+$/, '')
                  .trim();
                if (brief) items[number - 1] = brief;
              });
              return items;
            };
            const roleItems = new Map();
            const roleOrder = [];
            const addRoleItem = (role, number, text) => {
              if (!text) return;
              if (!roleItems.has(role)) roleItems.set(role, []);
              if (!roleOrder.includes(role)) roleOrder.push(role);
              roleItems.get(role).push(`${number}. ${text}`);
            };
            let issueNumber = 0;
            briefs.forEach((brief) => {
              const customerItems = parseNumberedBriefItems(brief.customerBrief);
              const supportItems = parseNumberedBriefItems(brief.supportBrief);
              const itemCount = Math.max(customerItems.length, supportItems.length, 1);
              const internalRole = brief.internalDepartment || '客服';
              for (let itemIndex = 0; itemIndex < itemCount; itemIndex += 1) {
                const customerItem = customerItems[itemIndex] || '';
                const supportItem = supportItems[itemIndex] || '';
                if (!customerItem && !supportItem) continue;
                issueNumber += 1;
                if (brief.startsWithInternal) {
                  addRoleItem(internalRole, issueNumber, supportItem);
                  addRoleItem('客戶', issueNumber, customerItem);
                } else {
                  addRoleItem('客戶', issueNumber, customerItem);
                  addRoleItem(internalRole, issueNumber, supportItem);
                }
              }
            });
            issue.value = roleOrder
              .map((role) => `${role}：${roleItems.get(role).join(' ')}`)
              .join('\n');
            issue.dispatchEvent(new Event('input', { bubbles: true }));
          }
          analysisSucceeded = true;
          showProgress(100);
          alert(`AI 分析完成：本次重新分析 ${pendingJobs.length} 筆，未變更內容沿用快取。請確認內容後再儲存。`);
        } catch (error) {
          console.error('日誌 NEW AI 分析失敗：', error);
          alert(`AI 分析失敗：${error?.message || '請稍後再試'}`);
        } finally {
          clearInterval(progressTimer);
          button.disabled = false;
          forceButton.disabled = false;
          if (analysisSucceeded) {
            button.textContent = 'AI 分析完成 100%';
            setTimeout(() => { if (!button.disabled) button.textContent = originalText; }, 1800);
          } else {
            button.textContent = originalText;
          }
        }
      });
      actionGroup.appendChild(button);
      actionGroup.appendChild(forceButton);
    };

    // 設計器儲存成功並關閉後重新載入，確保最新 Firebase 排版立刻套用到日誌 NEW。
    document.querySelector('#saveSchemaButton')?.addEventListener('click', () => {
      let checks = 0;
      const waitForDesignerSave = setInterval(() => {
        checks += 1;
        const modal = document.querySelector('#ragicDesignerModal');
        if (modal?.hidden) {
          clearInterval(waitForDesignerSave);
          window.location.reload();
        } else if (checks >= 30) {
          clearInterval(waitForDesignerSave);
        }
      }, 200);
    });

    const applyConversationImportDraft = async () => {
      const raw = sessionStorage.getItem('omniplayConversationImport');
      if (!raw || !new URLSearchParams(location.search).has('conversation')) return;
      let draft; try { draft = JSON.parse(raw); } catch (_) { return; }
      if (window.firebase?.auth && !firebase.auth().currentUser) {
        try { await firebase.auth().signInAnonymously(); } catch (error) { console.warn('收件匣身份建立失敗', error); }
      }
      let row = null;
      for (let attempt = 0; attempt < 60 && !row; attempt += 1) {
        if (!document.querySelector('#ragicFormView:not([hidden])')) document.querySelector('#newRecordButton')?.click();
        row = document.querySelector('#ragicForm [data-subtable="items"] .subtable-row');
        if (!row) await new Promise(resolve => setTimeout(resolve, 100));
      }
      if (!row) return alert('無法建立日誌匯入草稿，請重新從收件匣按「匯入」。');
      const setValue = (selector, value) => {
        const control = document.querySelector(selector);
        if (!control || value == null) return;
        control.value = value;
        control.dispatchEvent(new Event('input', { bubbles: true }));
        control.dispatchEvent(new Event('change', { bubbles: true }));
      };
      const created = draft.createdAtMillis ? new Date(draft.createdAtMillis) : new Date(draft.date);
      if (!Number.isNaN(created.getTime())) {
        const pad = value => String(value).padStart(2, '0');
        setValue('#ragicForm [name="date"]', `${created.getFullYear()}-${pad(created.getMonth()+1)}-${pad(created.getDate())}T${pad(created.getHours())}:${pad(created.getMinutes())}`);
      }
      // AI 的狀態只能作為建議；匯入本身不可直接把日誌標成已完成。
      // 先放入對話，之後若使用者選擇已完成，才能從最後一段正確帶入完成者與完成時間。
      setValue('#ragicForm [data-subfield="conversation"]', draft.conversationText || '');
      const importedStatus = draft.suggestedStatus === '已完成' ? '待辦中' : (draft.suggestedStatus || '待辦中');
      setValue('#ragicForm [name="status"]', importedStatus);
      setValue('#ragicForm [name="category"]', draft.suggestedCategory || '待定');
      if (importedStatus === '已完成') await fillLogNewCompletionFields({ notify: false });
      const images = (draft.attachments || []).filter(item => item.type === 'photo' && item.url).map(item => item.url);
      const imageInput = row.querySelector('[data-subfield="conversation_images"]');
      const imageArea = imageInput?.closest('.image-upload-area');
      if (imageInput && imageArea && images.length) {
        imageInput.dataset.imageValue = JSON.stringify(images);
        showImagePreview(images, imageArea, '圖片');
      }
      const importedAnalysis = draft.analysis || {};
      const analysisControl = row.querySelector('[data-subfield="ai_analysis"]');
      const summaryControl = row.querySelector('[data-subfield="summary"]');
      const issueControl = document.querySelector('#ragicForm [name="issue"]');
      if (analysisControl) analysisControl.value = normalizeLogNewAiAnalysis(importedAnalysis.analysis || importedAnalysis.fullText || '');
      if (summaryControl) summaryControl.value = importedAnalysis.summary || importedAnalysis.reason || '';
      if (issueControl) {
        issueControl.value = importedAnalysis.customerBrief || importedAnalysis.supportBrief
          ? `客戶：${importedAnalysis.customerBrief || importedAnalysis.issue || ''}\n客服：${importedAnalysis.supportBrief || ''}`
          : (importedAnalysis.issue || '');
      }
      [analysisControl, summaryControl, issueControl].filter(Boolean).forEach(control => {
        control.dispatchEvent(new Event('input', { bubbles: true }));
        control.dispatchEvent(new Event('change', { bubbles: true }));
      });
      window.__conversationImportId = draft.conversationId;
      if (draft.inboxApiBase) sessionStorage.setItem('omniplayInboxApiBase', draft.inboxApiBase);
      sessionStorage.removeItem('omniplayConversationImport');
      history.replaceState({}, '', location.pathname);
      alert('Conversation 與收件匣 AI 分析結果已完整匯入，請確認後儲存。');
    };

    document.querySelector('#ragicForm')?.addEventListener('submit', () => {
      const conversationId = window.__conversationImportId;
      if (!conversationId) return;
      setTimeout(async () => {
        try {
          const logId = window.getCurrentRagicRecordId?.() || '';
          if (!logId) return;
          const apiBase = sessionStorage.getItem('omniplayInboxApiBase') || '';
          const apiKey = sessionStorage.getItem('omniplayInboxAccessKey') || '';
          if (apiBase && apiKey) {
            const response = await fetch(apiBase.replace(/\/$/, '') + '/api/conversations/' + encodeURIComponent(conversationId), {
              method: 'PATCH',
              headers: { 'content-type': 'application/json', authorization: 'Bearer ' + apiKey },
              body: JSON.stringify({ imported: true, importedLogId: logId })
            });
            if (!response.ok) throw new Error('Conversation API ' + response.status);
          } else if (window.omniplayDb) {
            await window.omniplayDb.collection('conversations').doc(conversationId).update({
              imported: true,
              importedAt: firebase.firestore.FieldValue.serverTimestamp(),
              importedLogId: logId
            });
          }
          window.__conversationImportId = '';
          sessionStorage.removeItem('omniplayInboxApiBase');
          sessionStorage.removeItem('omniplayInboxAccessKey');
        } catch (error) { console.error('Conversation 匯入狀態更新失敗', error); }
      }, 1800);
    });
    setTimeout(applyConversationImportDraft, 300);

    // 欄位結構只在執行期補齊，不再因結構差異自動重新載入頁面。
    new MutationObserver(enhanceLogNewAiUi).observe(document.querySelector('#ragicFormView'), { childList: true, subtree: true });
    enhanceLogNewAiUi();
    migrateSavedLogNewConversations();
  </script>

  <script>
    // 日誌 NEW：列表中的問題描述一律使用完整原文，並依內容自動換行撐高。
    (() => {
      const showFullIssueDescriptions = () => {
        document.querySelectorAll('#ragicListView .ragic-table td[data-field-key="issue"], #ragicListView .ragic-table td:nth-child(7)').forEach((cell) => {
          const fullText = cell.getAttribute('title');
          if (fullText && (cell.textContent.trim().endsWith('…') || cell.textContent.trim().endsWith('...') || cell.textContent.length < fullText.length)) {
            cell.textContent = fullText;
          }
          cell.style.setProperty('white-space', 'pre-wrap', 'important');
          cell.style.setProperty('overflow', 'visible', 'important');
          cell.style.setProperty('text-overflow', 'clip', 'important');
          cell.style.setProperty('height', 'auto', 'important');
          cell.style.setProperty('max-height', 'none', 'important');
          cell.style.setProperty('overflow-wrap', 'anywhere', 'important');
          cell.style.setProperty('word-break', 'break-word', 'important');
        });
      };
      const listView = document.querySelector('#ragicListView');
      if (listView) new MutationObserver(showFullIssueDescriptions).observe(listView, { childList: true, subtree: true });
      showFullIssueDescriptions();
    })();
  </script>

  <style>
    .log-new-datetime-split { position: relative; width: 100%; }
    .log-new-date-display { width: 100% !important; min-width: 0 !important; cursor: pointer; }
    .log-new-calendar-time {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .log-new-calendar-time label { flex: 0 0 auto; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
    .log-new-time-input { flex: 1 1 auto; min-width: 0 !important; height: 38px !important; }
    .log-new-calendar-done { flex: 0 0 auto; min-height: 38px !important; padding: 6px 12px !important; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 800; }
    .log-new-calendar { position: absolute; z-index: 10030; top: calc(100% + 6px); left: 0; width: 320px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: 0 16px 40px rgba(15,23,42,.22); }
    .log-new-calendar[hidden] { display: none !important; }
    .log-new-calendar-head { display: grid; grid-template-columns: 38px 1fr 1fr 38px; gap: 6px; margin-bottom: 10px; }
    .log-new-calendar-head button, .log-new-calendar-head select { min-height: 38px !important; padding: 5px 7px !important; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
    .log-new-calendar-week, .log-new-calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .log-new-calendar-week span { padding: 5px 0; color: var(--text-secondary); text-align: center; font-size: 12px; }
    .log-new-calendar-days button { min-height: 34px !important; padding: 4px !important; border-radius: 8px; background: transparent; color: var(--text); font-weight: 600; }
    .log-new-calendar-days button:hover { background: var(--primary-soft); }
    .log-new-calendar-days button.is-selected { background: var(--primary); color: #fff; }
    .log-new-calendar-days button:disabled { visibility: hidden; }
    @media (max-width: 430px) { .log-new-calendar { width: min(320px, calc(100vw - 32px)); } }
  </style>
  <script>
    // 日誌 NEW：單一日期時間欄位，點開後使用自訂月曆並在月曆內選時間。
    (() => {
      const pad = (value) => String(value).padStart(2, '0');
      const enhanceDateTimePicker = () => {
        const original = document.querySelector('#ragicForm input[name="date"][type="datetime-local"]');
        if (!original || original.dataset.easyDateTime === 'true') return;
        original.dataset.easyDateTime = 'true';

        const wrapper = document.createElement('div');
        wrapper.className = 'log-new-datetime-split';
        const dateDisplay = document.createElement('input');
        dateDisplay.type = 'text';
        dateDisplay.readOnly = true;
        dateDisplay.className = 'log-new-date-display';
        dateDisplay.setAttribute('aria-label', '選擇日期');
        const timeInput = document.createElement('input');
        timeInput.type = 'time';
        timeInput.step = '60';
        timeInput.className = 'log-new-time-input';
        timeInput.required = original.required;
        timeInput.setAttribute('aria-label', '時間');

        const calendar = document.createElement('div');
        calendar.className = 'log-new-calendar';
        calendar.hidden = true;
        calendar.innerHTML = '<div class="log-new-calendar-head"><button type="button" data-step="-1">‹</button><select data-year aria-label="年份"></select><select data-month aria-label="月份"></select><button type="button" data-step="1">›</button></div><div class="log-new-calendar-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="log-new-calendar-days"></div><div class="log-new-calendar-time"><label>時間</label><span data-time-slot></span><button class="log-new-calendar-done" type="button">完成</button></div>';
        const yearSelect = calendar.querySelector('[data-year]');
        const monthSelect = calendar.querySelector('[data-month]');
        const days = calendar.querySelector('.log-new-calendar-days');
        calendar.querySelector('[data-time-slot]').appendChild(timeInput);
        const doneButton = calendar.querySelector('.log-new-calendar-done');
        for (let year = 2000; year <= 2100; year += 1) yearSelect.insertAdjacentHTML('beforeend', '<option value="' + year + '">' + year + ' 年</option>');
        for (let month = 0; month < 12; month += 1) monthSelect.insertAdjacentHTML('beforeend', '<option value="' + month + '">' + (month + 1) + ' 月</option>');

        let selected = new Date();
        const refreshDisplay = () => {
          const dateValue = dateDisplay.dataset.value || '';
          const [hourText = '', minute = ''] = String(timeInput.value || '').split(':');
          const hour = Number(hourText);
          const timeText = hourText
            ? (hour < 12 ? '上午 ' : '下午 ') + pad(hour % 12 || 12) + ':' + minute
            : '';
          dateDisplay.value = [dateValue ? dateValue.replace(/-/g, '/') : '', timeText].filter(Boolean).join(' ');
        };
        const writeOriginal = () => {
          const dateValue = dateDisplay.dataset.value || '';
          original.value = dateValue && timeInput.value ? dateValue + 'T' + timeInput.value : '';
          refreshDisplay();
          original.dispatchEvent(new Event('input', { bubbles: true }));
          original.dispatchEvent(new Event('change', { bubbles: true }));
        };
        const renderCalendar = () => {
          yearSelect.value = String(selected.getFullYear());
          monthSelect.value = String(selected.getMonth());
          days.innerHTML = '';
          const firstDay = new Date(selected.getFullYear(), selected.getMonth(), 1).getDay();
          const total = new Date(selected.getFullYear(), selected.getMonth() + 1, 0).getDate();
          for (let index = 0; index < firstDay; index += 1) days.insertAdjacentHTML('beforeend', '<button type="button" disabled></button>');
          const currentValue = dateDisplay.dataset.value || '';
          for (let day = 1; day <= total; day += 1) {
            const value = selected.getFullYear() + '-' + pad(selected.getMonth() + 1) + '-' + pad(day);
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = String(day);
            button.classList.toggle('is-selected', value === currentValue);
            button.addEventListener('click', () => {
              dateDisplay.dataset.value = value;
              selected = new Date(selected.getFullYear(), selected.getMonth(), day);
              writeOriginal();
              renderCalendar();
            });
            days.appendChild(button);
          }
        };
        const readOriginal = () => {
          const value = String(original.value || '');
          const dateValue = value.slice(0, 10);
          dateDisplay.dataset.value = dateValue;
          timeInput.value = value.slice(11, 16);
          refreshDisplay();
          if (dateValue) {
            const parts = dateValue.split('-').map(Number);
            selected = new Date(parts[0], parts[1] - 1, parts[2]);
          }
          renderCalendar();
        };

        dateDisplay.addEventListener('click', () => { calendar.hidden = !calendar.hidden; renderCalendar(); });
        timeInput.addEventListener('change', writeOriginal);
        doneButton.addEventListener('click', () => { writeOriginal(); calendar.hidden = true; });
        original.addEventListener('input', readOriginal);
        yearSelect.addEventListener('change', () => { selected.setFullYear(Number(yearSelect.value)); renderCalendar(); });
        monthSelect.addEventListener('change', () => { selected.setMonth(Number(monthSelect.value)); renderCalendar(); });
        calendar.querySelectorAll('[data-step]').forEach((button) => button.addEventListener('click', () => { selected.setMonth(selected.getMonth() + Number(button.dataset.step)); renderCalendar(); }));
        document.addEventListener('click', (event) => { if (!wrapper.contains(event.target)) calendar.hidden = true; });

        readOriginal();
        original.hidden = true;
        original.insertAdjacentElement('afterend', wrapper);
        wrapper.append(dateDisplay, calendar);
      };
      const formView = document.querySelector('#ragicFormView');
      if (formView) new MutationObserver(enhanceDateTimePicker).observe(formView, { childList: true, subtree: true });
      enhanceDateTimePicker();
    })();
  </script>
